<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Invitaciones Web AR</title>
    <script>
      var path = window.location.pathname;
      var base = "/";
      var repo = "/InvitacionesWeb/";

      if (path.indexOf(repo) === 0) {
        base = repo;
        path = path.slice(repo.length - 1);
      }

      window.location.replace(base + "#" + path + window.location.search);
    </script>
  </head>
  <body></body>
</html>
